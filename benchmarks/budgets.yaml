targets:
  - match: BenchmarkMemory/Queue/mutexring/MPMC/P=1/batch=1/*
    ns_op_target: 50
  - match: BenchmarkMemory/PubSubAck/safe/1P1C/bytes=64/reuse=on
    msgs_s_target: 5000000
    p99_ns_target: 20000
  - match: BenchmarkMemory/PubSubAck/owned/1P1C/bytes=64/reuse=on
    msgs_s_target: 10000000
  - match: BenchmarkMemory/PubSubAck/*/8P8C/bytes=64/reuse=on
    msgs_s_target: 20000000
  - match: BenchmarkMemory/Scheduler/hashedwheel/insert/n=1000000/*
    ns_entry_target: 100
    bytes_entry_target: 200
waivers: []
