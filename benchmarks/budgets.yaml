      - overhead
    spec: core overhead vs raw client, batched workloads <= 5 % throughput loss (internal goal 3 %)
  - kind: ratio
    numerator: BenchmarkDriver/nats/core/PublishBatch/1KiB
    denominator: BenchmarkNative/nats/PublishBatch/1KiB
    max_pct: 5
    gates:
      - overhead
    spec: core overhead vs raw client, batched workloads <= 5 % throughput loss (internal goal 3 %)
  - kind: ratio
