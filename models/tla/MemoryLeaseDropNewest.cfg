\* MemoryLease with a lane that holds one record and two offered to it, under
\* OverflowDropNewest: the publication that found no room is discarded and
\* counted, and the engine releases the payload it was handed.
SPECIFICATION Spec
CONSTANTS
  N = 2
  Consumers = {c1, c2}
  Cap = 1
  MaxTime = 4
  MaxAttempts = 2
  Sealing = FALSE
  HasDLQ = TRUE
  Overflow = "dropnew"
INVARIANTS
  TypeOK
  OneState
  LeaseUnique
  AttemptsMonotone
  MaxAttemptsRespected
  CapacityNonNegative
  Conservation
  ReleaseOnce
  NoEarlyDelivery
  ClosedTerminal
  DeadLetterBeforeSettle
  OverflowAccounted
PROPERTIES
  StrictBlocksLane
  NoUnadmittedSettlement
