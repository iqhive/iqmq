\* TLC configuration for FanoutReserveBestEffort.tla: the FanoutReserve model under the
\* besteffort policy. Same two publishers, three subscriptions and capacity
\* of one; the policy-independent invariants must hold here too.
SPECIFICATION Spec
CONSTANTS
  Pubs = {p1, p2}
  Subs = {s1, s2, s3}
  Cap = 1
  Policy = "besteffort"
INVARIANTS
  TypeOK
  NoOverflow
  ReservationBalance
  AtomicAllOrNothing
  PartialAccounted
  DropSlowAccounted
  Isolation
  NoStarvation
PROPERTIES
  NoUnreservedAdmission
