\* TLC configuration for KafkaCommit.tla: offsets 0..4, a tracking window of
\* three offsets and one revocation. Exhaustive in seconds.
SPECIFICATION Spec
CONSTANTS
  MaxOffset = 4
  Window = 3
  MaxGen = 2
INVARIANTS
  TypeOK
  SafeWatermark
  WatermarkProgress
  BoundedWindow
  StaleGenRejected
  CommitSafe
PROPERTIES
  WatermarkMonotone
  CommitMonotone
