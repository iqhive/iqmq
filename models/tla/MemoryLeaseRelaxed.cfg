\* MemoryLease under a placement that does not block the lane, and with no
\* dead-letter topic: a record that uses up its attempts is discarded and
\* counted, which is what a broker with a redelivery limit and no dead-letter
\* exchange does.
SPECIFICATION Spec
CONSTANTS
  N = 2
  Consumers = {c1, c2}
  Cap = 2
  MaxTime = 4
  MaxAttempts = 2
  Sealing = FALSE
  HasDLQ = FALSE
  Overflow = "reject"
INVARIANTS
  TypeOK
  OneState
  LeaseUnique
  AttemptsMonotone
  MaxAttemptsRespected
  CapacityNonNegative
  Conservation
  ReleaseOnce
  NoEarlyDelivery
  ClosedTerminal
  DeadLetterBeforeSettle
  OverflowAccounted
PROPERTIES
  StrictBlocksLane
  NoUnadmittedSettlement
