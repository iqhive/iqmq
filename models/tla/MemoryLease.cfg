\* TLC configuration for MemoryLease.tla: three records, two consumers, a lane
\* capacity of two and a clock bounded at four, under the strictest
\* configuration — a sealing retry placement (BlockLane, or any placement
\* under OrderingStrict), an attempt budget of two, a dead-letter topic, and
\* OverflowReject. The sibling configurations MemoryLease{Relaxed,Overflow,
\* DropNewest} re-check the same model under the placements and overflow
\* policies this one fixes.
\*
\* the specification D sizes this model at two records and a capacity of two, but
\* a lane with room for every record it is offered can never refuse one:
\* Refuse and DropOldest both need ~Room while a record is still "new", so
\* with N = Cap the whole overflow half of the specification is unreachable
\* here and OverflowAccounted holds vacuously. One more record than the lane
\* can hold makes the reject arm reachable — and OverflowAccounted
\* falsifiable — in the configuration the gate names
\* (make tla SPEC=MemoryLease), at the cost of a longer run (4.8M states
\* rather than 107k). The capacity the specification asks for is unchanged.
SPECIFICATION Spec
CONSTANTS
  N = 3
  Consumers = {c1, c2}
  Cap = 2
  MaxTime = 4
  MaxAttempts = 2
  Sealing = TRUE
  HasDLQ = TRUE
  Overflow = "reject"
INVARIANTS
  TypeOK
  OneState
  LeaseUnique
  AttemptsMonotone
  MaxAttemptsRespected
  CapacityNonNegative
  Conservation
  ReleaseOnce
  NoEarlyDelivery
  ClosedTerminal
  DeadLetterBeforeSettle
  OverflowAccounted
PROPERTIES
  StrictBlocksLane
  NoUnadmittedSettlement
