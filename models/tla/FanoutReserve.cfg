\* TLC configuration for FanoutReserve.tla: two publishers, three
\* subscriptions and a capacity of one record each, under the Atomic policy —
\* the default, and the only one that promises all-or-nothing. The other three
\* policies are checked by overriding Policy; every invariant below is written
\* to hold for each of them. Exhaustive in seconds.
SPECIFICATION Spec
CONSTANTS
  Pubs = {p1, p2}
  Subs = {s1, s2, s3}
  Cap = 1
  Policy = "atomic"
INVARIANTS
  TypeOK
  NoOverflow
  ReservationBalance
  AtomicAllOrNothing
  PartialAccounted
  DropSlowAccounted
  Isolation
  NoStarvation
PROPERTIES
  NoUnreservedAdmission
