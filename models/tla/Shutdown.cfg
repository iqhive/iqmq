\* TLC configuration for Shutdown.tla: two records, two closers, a clock of
\* five ticks and a drain deadline of two. Two records are the fewest that can
\* have one half-placed while another is in flight, which is the interleaving
\* NoLostInFlight is about; two closers are the fewest that can race for the
\* run CloseIdempotent bounds; and a deadline strictly inside the clock is
\* what makes DrainBounded reachable rather than vacuous — with Deadline =
\* MaxTime the drain would never be observed expiring. Exhaustive in seconds.
SPECIFICATION Spec
CONSTANTS
  Records = {m1, m2}
  Closers = {c1, c2}
  MaxTime = 5
  Deadline = 2
INVARIANTS
  TypeOK
  CloseIdempotent
  NoPublishAfterStopAccept
  NoFetchAfterStopFetch
  DLQBeforeAck
  NoLostInFlight
  ReleaseOnce
  DrainBounded
PROPERTIES
  PhaseMonotone
