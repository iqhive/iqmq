site_name: iqmq
site_description: The capability-honest, high-performance Go messaging abstraction
repo_url: https://github.com/iqhive/iqmq
repo_name: iqhive/iqmq
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

# mkdocs reports a broken in-page ANCHOR as INFO, and `--strict` promotes
# WARNING and not INFO, so a page linking a sibling's section by GitHub's
# slug (`#ack--nack--extend-mapping`, two dashes, where python-markdown's toc
# mints one) built green. Nine such links existed. `warn` + `strict: true`
# makes them a build failure; `make docs-check` holds the same property with
# no Python, because `make ci` cannot run mkdocs.
validation:
  anchors: warn
  unrecognized_links: warn
  nav:
    omitted_files: info

# Pages deliberately outside the nav. `bakeoff decide` writes one report per
# variant row and `confgen` one capability table per driver profile, so the
# nav would carry seventy entries nobody navigates by. They are not orphans:
# `make docs-check` requires every page under docs/ to be REACHABLE by a link
# from the nav, which is the property that matters and which mkdocs reports
# only as INFO. Before that check, 48 variant reports and 19 capability
# tables were linked from nothing at all.
not_in_nav: |
  drivers/_template.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

extra:
  version:
    provider: mike

