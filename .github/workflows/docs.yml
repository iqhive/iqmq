name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "adr/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "adr/**"
  workflow_dispatch:

permissions:
  contents: read

# One group per ref. A pull request cancels its own superseded run; a push to
# `main` or a tag does not. The deploys of every ref are serialised by the
# `deploy` job's own group below, not here: a workflow-level group shared by
# `main` and the tags kept one run pending and CANCELLED it when the next run
# arrived, so a docs push to main while main was deploying dropped a pending
# release tag's deploy, and that version was never published.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # ratchet:lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress --exclude-path site 'docs/**/*.md' 'README.md' 'adr/**/*.md'
          fail: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: site
          path: site/
          retention-days: 7

  deploy:
    name: deploy versioned site
    needs: build
    if: ${{ !github.event.repository.private && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `mike deploy --push` commits to the `gh-pages` branch, so two deploys in
    # flight at once race on it, and every ref's deploy shares this one group
    # to run one at a time. `queue: max` keeps every waiting deploy (up to 100)
    # in order; the default keeps one and cancels it when another arrives.
    # actionlint 1.7.12 does not know the key yet, so .github/actionlint.yaml
    # ignores that one message for this file.
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          version="${GITHUB_REF_NAME}"
          [ "$version" = "main" ] && version="dev"
          mike deploy --push --update-aliases "$version" latest
