name: labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# `pull_request_target` only, so every run is a pull request's and a superseded
# one is worthless: the labels the last run computes are the labels that should
# be on the pull request, and `sync-labels: true` means an older run finishing
# second would put back labels the newer one removed.
concurrency:
  group: labeler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: label by path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # ratchet:actions/labeler@v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
