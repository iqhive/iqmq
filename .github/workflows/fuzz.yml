name: fuzz

on:
  pull_request:
  schedule:
    - cron: "0 1 * * 3" # weekly full campaign: 4 minutes per target, 8 shards
    - cron: "0 4 * * 0" # weekly: race-instrumented fuzzing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: "off"

jobs:
  seeds-and-changed:
    name: seed corpora and changed packages
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: make fuzz-seeds
      - run: make ratchet
      - name: short fuzz of changed packages
        if: github.event_name == 'pull_request'
        run: ./hack/fuzz-changed.sh origin/${{ github.base_ref }} 15s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: fuzz-crashers-pr
          path: "**/testdata/fuzz/**"

  nightly:
    name: weekly shard ${{ matrix.shard }}
    if: github.event_name == 'schedule' && github.event.schedule == '0 1 * * 3'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.shard }}-
      # Allow 4m per target across eight shards. Restore the cached corpus
      # so later campaigns can continue exploring previous inputs.
      - run: ./hack/fuzz.sh shard 8 ${{ matrix.shard }} 4m
        env:
          FUZZ_RESULTS_SUFFIX: -shard${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: fuzz-crashers-${{ matrix.shard }}
          path: "**/testdata/fuzz/**"
      # Export the corpus on the runner whose local cache contains it.
      - name: corpus export and this shard's additions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          make fuzz-corpus
          mkdir -p reports
          git ls-files --others --modified --exclude-standard -- '**/testdata/fuzz/**' > reports/corpus-additions.txt
          if [ -s reports/corpus-additions.txt ]; then
            tar -czf "reports/fuzz-corpus-additions-${{ matrix.shard }}.tar.gz" \
              --files-from reports/corpus-additions.txt
          fi
          wc -l < reports/corpus-additions.txt | sed 's/^/corpus additions: /' >> "$GITHUB_STEP_SUMMARY"
      # Two artefacts, not one: `fuzz-results-*` is merged into one directory
      # by the manifest job, so it holds nothing but this shard's `.jsonl` --
      # a second path would move the archive's root to the workspace and the
      # merge would land the results a directory deeper than fuzzmanifest
      # looks.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: fuzz-results-${{ matrix.shard }}
          path: benchmarks/reports/fuzz/*.jsonl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: fuzz-corpus-${{ matrix.shard }}
          path: reports/
          if-no-files-found: warn

  # Aggregate all shards into a manifest, including failed runs.
  # Require a result for every target so a missing shard cannot pass.
  nightly-manifest:
    name: weekly fuzz manifest
    needs: nightly
    if: ${{ always() && github.event_name == 'schedule' && github.event.schedule == '0 1 * * 3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          pattern: fuzz-results-*
          path: benchmarks/reports/fuzz
          merge-multiple: true
      # Reject a manifest with missing target results.
      - run: make fuzz-manifest-complete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: fuzz-manifest
          path: reports/fuzz-manifest.json
          if-no-files-found: error

  # Split the weekly race campaign across eight shards at 2m per target.
  weekly-race:
    name: weekly race shard ${{ matrix.shard }}
    if: github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: ./hack/fuzz.sh race-shard 8 ${{ matrix.shard }} 2m
        env:
          FUZZ_RESULTS_SUFFIX: -race${{ matrix.shard }}
      # Upload race logs alongside crashers. Worker stack traces are needed
      # to diagnose a race reported by the fuzz coordinator.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: race-crashers-${{ matrix.shard }}
          path: |
            **/testdata/fuzz/**
            benchmarks/reports/fuzz/race-logs/**
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: race-results-${{ matrix.shard }}
          path: benchmarks/reports/fuzz/*.jsonl
          if-no-files-found: error

  weekly-race-manifest:
    name: weekly race fuzz manifest
    needs: weekly-race
    if: ${{ always() && github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # ratchet:actions/download-artifact@v8.0.2
        with:
          pattern: race-results-*
          path: benchmarks/reports/fuzz
          merge-multiple: true
      - run: make fuzz-manifest-complete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: race-fuzz-manifest
          path: reports/fuzz-manifest.json
          if-no-files-found: error
