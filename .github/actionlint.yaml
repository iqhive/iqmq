# actionlint configuration.
#
# `self-hosted-runner.labels` declares the custom label of the org's
# self-hosted pool this repository uses. Without it actionlint rejects
# `runs-on: [self-hosted, Linux, X64, public]` with "label \"public\" is
# unknown": it knows every GitHub-hosted label and nothing about ours.
#
# Declaring it is not a formality: it is what makes a TYPO in a runner label
# fail `make workflows-lint`. A job whose `runs-on` names a label no runner
# carries does not fail -- it QUEUES, for the 24 hours GitHub allows before it
# gives up, reporting nothing a reader can act on. That is the failure mode
# this file converts into a lint error.
#
# `public` is the only one. This repository is public, the org's Default runner
# group serves it through the `public` label, and its jobs reach that pool on a
# push to main only (ci.yml's routing expression). The `private` label is the
# org's private runner group, which a public repository must never use, so it
# is left out on purpose: a job that names it fails this lint, and
# hack/gate-parity.py refuses it as well, in any workflow.
self-hosted-runner:
  labels:
    - public
